name: pharma_stock_manager
description: "Medical Store Stock Management System with AI Bill Scanning"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Requested Flutter packages
  camera: ^0.10.5+9
  google_mlkit_text_recognition: ^0.11.0
  sqflite: ^2.3.2
  path_provider: ^2.1.2
  image_picker: ^1.0.7

  # UI & Helper packages
  cupertino_icons: ^1.0.8
  intl: ^0.19.0
  path: ^1.9.0
  http: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
